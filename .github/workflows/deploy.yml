name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm run lint

      - run: pnpm run fmt

      - uses: actions/configure-pages@v6

      - run: pnpm run build

      - name: Inspect base-path artifact
        run: |
          test -f build/index.html
          test -f build/404.html
          grep -q 'assets: "/todo-crumble"' build/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
